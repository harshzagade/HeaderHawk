[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headerhawk"
version = "1.0.0"
description = "HTTP security header analyzer and grader - scores CSP, HSTS, X-Frame-Options and friends, explains every miss, suggests fixes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harsh Zagade" }]
keywords = ["security", "headers", "csp", "hsts", "recon", "red-team", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
headerhawk = "headerhawk.cli:main"

[project.urls]
Homepage = "https://github.com/harshzagade/HeaderHawk"

[tool.setuptools.packages.find]
include = ["headerhawk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
